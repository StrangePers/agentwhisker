<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentWhisker</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <main id="app">
      <section class="pet-stage" aria-label="Desktop pet">
        <div id="pet" class="codex-avatar-root" role="img" tabindex="0" aria-label="AgentWhisker" title="AgentWhisker · правая кнопка — меню"></div>
        <div id="currentTask" class="current-task" aria-live="polite">Читаем задачи…</div>
      </section>

      <div id="petActions" role="group" aria-label="Действия питомца">
        <button id="settingsButton" class="arc-button" type="button" aria-label="Настройки питомца" title="Настройки питомца" aria-controls="settingsPopover" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 3-.6 2.2-2 .9-2-.7-2 3.4 1.6 1.6v2.3L3.4 15l2 3.4 2.2-.6 1.8 1L10 21h4l.6-2.2 1.9-1 2.1.6 2-3.4-1.6-1.7v-2.6L20.6 9l-2-3.4-2.1.6-1.9-1L14 3Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      <button id="limitsButton" class="arc-button limits-button" type="button" aria-label="Показать лимиты" title="Показать лимиты" aria-expanded="false" aria-controls="limitsPopover">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0M12 13l4-5M7 16h.01M17 16h.01"/><circle cx="12" cy="13" r="1.4"/></svg>
      </button>
        <button id="threadBadge" class="arc-button thought-button" type="button" aria-label="Показать задачи" aria-controls="threadPopover" aria-expanded="false">0</button>
      </div>
      <section id="limitsPopover" class="limits-popover" aria-label="Лимиты подписок" aria-hidden="true" hidden>
        <header class="limits-heading">
          <div><h2>Лимиты подписок</h2><p id="limitsDescription">Остаток и время сброса</p></div>
          <button id="limitsRefreshButton" class="limits-refresh" type="button" aria-label="Обновить лимиты" title="Обновить лимиты">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3a7 7 0 0 0 11.6-1"/></svg>
          </button>
        </header>
        <p id="limitsStatus" class="limits-message" role="status">Читаем лимиты…</p>
        <div id="limitsProviders"></div>
        <div id="limitsExtra" class="limits-extra"></div>
      </section>

      <section id="threadPopover" class="thread-popover" aria-label="Задачи" aria-hidden="true" inert>
        <button id="collapseTasks" type="button" aria-label="Свернуть задачи">
          <span><strong id="taskCount">Задачи</strong><span id="taskScope"></span></span>
          <svg class="thread-close" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          <span class="thread-hint" aria-hidden="true">Свернуть задачи</span>
        </button>
        <div class="thread-content">
          <div class="thread-body">
            <p id="consoleError" role="alert"></p>
            <p id="taskMessage" role="status">Читаем задачи…</p>
            <ul id="sessionList" class="session-list" aria-label="Активные задачи"></ul>
          </div>
        </div>
      </section>

      <section id="settingsPopover" class="settings-popover" aria-label="Настройки питомца" aria-hidden="true">
        <header class="pet-heading"><h2>Питомец</h2><button id="closeSettings" aria-label="Закрыть настройки">×</button></header>
        <div class="skin-heading">Персонаж</div>
        <div id="skinGallery" class="skin-gallery" role="group" aria-label="Выбор персонажа"></div>
        <button id="importPet" type="button">Установить персонажа…</button>
        <div id="importResult" role="status"></div>
        <label class="setting-pair" for="petSizeInput">Размер <output id="petSizeValue" for="petSizeInput"></output></label>
        <input id="petSizeInput" type="range" min="72" max="360" step="4">
        <div class="idle-animation-setting">
          <label for="idleAnimationMode">Анимация в покое</label>
          <select id="idleAnimationMode" disabled>
            <option value="continuous">Постоянно</option>
            <option value="events-only">Только при событиях</option>
          </select>
          <div id="idleAnimationStatus" role="status"></div>
        </div>
        <label class="setting-pair" for="taskLabelToggle">Подпись под питомцем <input id="taskLabelToggle" type="checkbox" role="switch" checked></label>
        <label class="setting-pair bubble-setting" for="busyBubbleToggle">Облачко при активных задачах <input id="busyBubbleToggle" type="checkbox" role="switch" checked></label>
        <div class="connection">
          <details id="connectionOptions"><summary><strong id="connectionName">Источник</strong><span>Автоматически</span></summary>
            <div id="sourceOptions"><label>Источник <select id="providerSelect"></select></label>
            <label id="statusFileRow">Файл статуса <input id="statusFileInput" type="text"></label></div>
          </details>
          <div id="liveStatus" role="status"></div>
          <button id="openStatusTask" hidden>Открыть задачу</button>
        </div>
        <details id="motionOptions"><summary>Посмотреть движения</summary>
          <div class="motion-grid"><button data-preview="idle">Отдыхает</button><button data-preview="running">Работает</button>
          <button data-preview="waiting">Ждёт решения</button><button data-preview="failed">Ошибка</button></div>
        </details>
      </section>
    </main>
    <script src="./skins.js"></script>
    <script src="./sprite-geometry.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
