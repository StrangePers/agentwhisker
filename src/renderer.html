<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentWhisker</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <main id="app">
      <section class="pet-stage" data-t-label="petRegion">
        <div id="pet" class="codex-avatar-root" role="img" tabindex="0" aria-label="AgentWhisker"></div>
        <div id="currentTask" class="current-task" aria-live="polite" data-t="loadingTasks"></div>
      </section>

      <div id="petActions" role="group" data-t-label="petActions">
        <button id="settingsButton" class="arc-button" type="button" data-t-label="petSettings" data-t-title="petSettings" aria-controls="settingsPopover" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 3-.6 2.2-2 .9-2-.7-2 3.4 1.6 1.6v2.3L3.4 15l2 3.4 2.2-.6 1.8 1L10 21h4l.6-2.2 1.9-1 2.1.6 2-3.4-1.6-1.7v-2.6L20.6 9l-2-3.4-2.1.6-1.9-1L14 3Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      <button id="limitsButton" class="arc-button limits-button" type="button" data-t-label="showLimits" data-t-title="showLimits" aria-expanded="false" aria-controls="limitsPopover">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0M12 13l4-5M7 16h.01M17 16h.01"/><circle cx="12" cy="13" r="1.4"/></svg>
      </button>
        <button id="threadBadge" class="arc-button thought-button" type="button" data-t-label="showTasks" aria-controls="threadPopover" aria-expanded="false"><span class="thought-face" aria-hidden="true"></span><span id="badgeNumber">0</span></button>
      </div>
      <section id="limitsPopover" class="limits-popover" data-t-label="usageLimits" aria-hidden="true" hidden>
        <header class="limits-heading">
          <div><h2 data-t="usageLimits"></h2><p id="limitsDescription" data-t="limitsDescription"></p></div>
          <button id="limitsRefreshButton" class="limits-refresh" type="button" data-t-label="refreshLimits" data-t-title="refreshLimits">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3a7 7 0 0 0 11.6-1"/></svg>
          </button>
        </header>
        <p id="limitsStatus" class="limits-message" role="status" data-t="readLimits"></p>
        <div id="limitsProviders"></div>
        <button id="limitsShowAll" class="limits-more" type="button" aria-expanded="false" aria-controls="limitsProviders" hidden data-t="showAllLimits"></button>
        <details id="limitsCredits" class="limits-extra" hidden>
          <summary data-t="limitCredits"></summary>
          <div id="limitsExtra"></div>
        </details>
      </section>

      <section id="threadPopover" class="thread-popover" data-t-label="tasks" aria-hidden="true" inert>
        <button id="collapseTasks" type="button" data-t-label="collapseTasks">
          <span><strong id="taskCount" data-t="tasks"></strong><span id="taskScope"></span></span>
          <svg class="thread-close" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          <span class="thread-hint" aria-hidden="true" data-t="collapseTasks"></span>
        </button>
        <div class="thread-content">
          <div class="thread-body">
            <p id="consoleError" role="alert"></p>
            <p id="taskMessage" role="status" data-t="loadingTasks"></p>
            <ul id="sessionList" class="session-list" data-t-label="activeTasks"></ul>
            <details id="completedTasks" hidden><summary data-t="recentlyCompleted"></summary><ul class="session-list" id="completedList"></ul></details>
          </div>
        </div>
      </section>

      <section id="settingsPopover" class="settings-popover" data-t-label="petSettings" aria-hidden="true">
        <header class="pet-heading">
          <h2 data-t="pet"></h2>
          <span id="appVersion" class="app-version" hidden></span>
          <button id="closeSettings" data-t-label="closeSettings">×</button>
        </header>
        <div class="settings-content">
        <section id="firstConnection" hidden>
          <strong data-t="connectAgent"></strong>
          <p id="discoveryMessage" role="status" data-t="findingAgents"></p>
          <div id="detectedAgents"></div>
          <button type="button" id="manualConnect" data-t="chooseSource"></button>
          <button type="button" id="keepDesktop" data-t="keepDesktop"></button>
        </section>
        <div class="skin-heading" data-t="character"></div>
        <div id="skinGallery" class="skin-gallery" role="group" data-t-label="chooseCharacter"></div>
        <button id="importPet" type="button" data-t="installCharacterAction"></button>
        <div id="importResult" role="status"></div>
        <label class="setting-pair" for="petSizeInput"><span data-t="size"></span> <output id="petSizeValue" for="petSizeInput"></output></label>
        <input id="petSizeInput" type="range" min="72" max="360" step="4">
        <div class="idle-animation-setting">
          <label for="idleAnimationMode" data-t="idleAnimation"></label>
          <select id="idleAnimationMode" disabled>
            <option value="continuous" data-t="continuous"></option>
            <option value="events-only" data-t="eventsOnly"></option>
          </select>
          <div id="idleAnimationStatus" role="status"></div>
        </div>
        <div class="language-setting">
          <label for="languageSelect" data-t="language"></label>
          <select id="languageSelect" disabled></select>
          <div id="languageStatus" role="status"></div>
        </div>
        <label class="setting-pair" for="taskLabelToggle"><span data-t="taskLabel"></span> <input id="taskLabelToggle" type="checkbox" role="switch" checked></label>
        <label class="setting-pair bubble-setting" for="busyBubbleToggle"><span data-t="taskBubble"></span> <input id="busyBubbleToggle" type="checkbox" role="switch" checked></label>
        <div id="windowsSettings" hidden>
          <label class="setting-pair"><span data-t="launchAtLogin"></span> <input id="loginToggle" type="checkbox" role="switch"></label>
          <label class="setting-pair"><span data-t="notifyOnAttention"></span> <input id="attentionToggle" type="checkbox" role="switch"></label>
          <div id="dailySaveError" role="status" hidden data-t="dailySaveError"></div>
        </div>
        <div class="language-setting" id="limitsPreferenceRow" hidden>
          <label for="limitsPreference" data-t="limitsButtonSetting"></label>
          <select id="limitsPreference">
            <option value="auto" data-t="automatic"></option>
            <option value="hidden" data-t="hideLimitsButton"></option>
          </select>
        </div>
        <div class="connection">
          <details id="connectionOptions"><summary><strong id="connectionName" data-t="source"></strong><span data-t="automatic"></span></summary>
            <div id="sourceOptions"><fieldset id="agentChoices"><legend data-t="trackAgents"></legend></fieldset>
            <div id="statusFileRow"><label><span data-t="statusFile"></span> <input id="statusFileInput" type="text"></label><button type="button" id="chooseStatusFile" data-t="chooseFile"></button></div></div>
          </details>
          <div id="liveStatus" role="status"></div>
          <div id="sourceDiagnostic" role="status"></div>
          <button type="button" id="retrySource" hidden data-t="retrySource"></button>
          <button id="openStatusTask" hidden data-t="openTask"></button>
        </div>
        <details id="motionOptions"><summary data-t="previewAnimations"></summary>
          <div class="motion-grid"><button data-preview="idle" data-t="idle"></button><button data-preview="running" data-t="running"></button>
          <button data-preview="waiting" data-t="waiting"></button><button data-preview="failed" data-t="failed"></button></div>
        </details>
        </div>
      </section>
    </main>
    <script src="./locale.js"></script>
    <script src="./skins.js"></script>
    <script src="./sprite-geometry.js"></script>
    <script src="./agent-selection.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
